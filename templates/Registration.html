<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Registration Form</title>
    <link rel="stylesheet" href="Registration.css">
</head>
<body>

<header>
    <h1>Placement Preparation Portal</h1>
    <p>Student Registration Form</p>
</header>

<div class="container">

<form>

<h2>Personal Details</h2>

<div class="row">
<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Enter your email" required>
</div>
</div>

<div class="row">
<div class="input-box">
<label>Mobile Number</label>
<input type="tel" placeholder="Enter mobile number" required>
</div>

<div class="input-box">
<label>Date of Birth</label>
<input type="date" required>
</div>
</div>

<div class="row">
<div class="input-box">
<label>Gender</label>

<div class="radio-group">
<label><input type="radio" name="gender"> Male</label>
<label><input type="radio" name="gender"> Female</label>
<label><input type="radio" name="gender"> Other</label>
</div>

</div>
</div>

<hr>

<h2>Academic Details</h2>

<div class="row">

<div class="input-box">
<label>College Name</label>
<input type="text" placeholder="College Name">
</div>

<div class="input-box">
<label>Roll Number</label>
<input type="text">
</div>

</div>

<div class="row">

<div class="input-box">
<label>Branch</label>

<select>
<option>CSE</option>
<option>CSE (Data Science)</option>
<option>AI & DS</option>
<option>IT</option>
<option>Mechanical</option>
<option>Civil</option>
<option>Electrical</option>
</select>

</div>

<div class="input-box">
<label>Current Year</label>

<select>
<option>First Year</option>
<option>Second Year</option>
<option>Third Year</option>
<option>Final Year</option>
</select>

</div>

</div>

<div class="row">

<div class="input-box">
<label>CGPA</label>
<input type="number" step="0.01">
</div>

<div class="input-box">
<label>10th Percentage</label>
<input type="number">
</div>

</div>

<div class="row">

<div class="input-box">
<label>12th / Diploma Percentage</label>
<input type="number">
</div>

<div class="input-box">
<label>Backlogs</label>

<select>
<option>No</option>
<option>Yes</option>
</select>

</div>

</div>

<hr>

<h2>Preferred Training Areas</h2>

<div class="checkbox-group">

<label><input type="checkbox"> Aptitude</label>

<label><input type="checkbox"> C Programming</label>

<label><input type="checkbox"> C++</label>

<label><input type="checkbox"> Java</label>

<label><input type="checkbox"> Python</label>

<label><input type="checkbox"> SQL</label>

<label><input type="checkbox"> DSA</label>

<label><input type="checkbox"> Web Development</label>

<label><input type="checkbox"> Communication Skills</label>

<label><input type="checkbox"> HR Interview</label>

</div>

<hr>

<h2>Placement Interests</h2>

<div class="radio-group">

<label><input type="radio" name="placement"> Internship</label>

<label><input type="radio" name="placement"> Full-Time Job</label>

<label><input type="radio" name="placement"> Both</label>

</div>

<hr>

<h2>Preferred Company</h2>

<div class="row">

<div class="input-box">

<label>Dream Company</label>

<select>

<option>TCS</option>

<option>Infosys</option>

<option>Wipro</option>

<option>Accenture</option>

<option>Capgemini</option>

<option>Deloitte</option>

<option>Cognizant</option>

<option>IBM</option>

</select>

</div>

<div class="input-box">

<label>Expected Package (LPA)</label>

<input type="number">

</div>

</div>

<div class="row">

<div class="input-box">

<label>Ready to Relocate?</label>

<select>

<option>Yes</option>

<option>No</option>

</select>

</div>

<div class="input-box">

<label>Resume Upload</label>

<input type="file">

</div>

</div>

<hr>

<h2>Career Goal</h2>

<textarea rows="6" placeholder="Write your career goal..."></textarea>

<div class="buttons">

<button type="submit">Register</button>

<button type="reset">Reset</button>

</div>

</form>

</div>

<footer>

<p>© 2026 Placement Preparation Portal | Student Registration Form</p>

</footer>

</body>
</html>
